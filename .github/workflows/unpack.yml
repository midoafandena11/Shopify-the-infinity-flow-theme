name: Unpack theme zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the zip
        id: zip
        run: |
          Z="$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD | grep -E '^[^/]+\.zip$' | head -1 || true)"
          if [ -z "$Z" ]; then Z="$(ls -t ./*.zip 2>/dev/null | head -1 || true)"; fi
          if [ -z "$Z" ]; then echo "No zip file found in the repo root"; exit 1; fi
          echo "Using: $Z"
          echo "path=$Z" >> "$GITHUB_OUTPUT"
      - name: Unpack
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          rm -rf /tmp/new && mkdir /tmp/new
          unzip -o -q "$ZIP" -d /tmp/new || [ $? -eq 1 ]
          SRC=/tmp/new
          if [ ! -d "$SRC/layout" ]; then
            SUB="$(find "$SRC" -maxdepth 3 -type d -name layout | head -1)"
            if [ -n "$SUB" ]; then SRC="$(dirname "$SUB")"; fi
          fi
          if [ ! -d "$SRC/layout" ]; then echo "No layout folder inside the zip"; ls -R /tmp/new | head -40; exit 1; fi
          rm -rf "$SRC/.github"
          for d in assets blocks config layout locales sections snippets templates; do rm -rf "$d"; done
          cp -r "$SRC"/. .
          find . -maxdepth 1 -name '*.zip' -delete
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Update theme from zip"
          git push origin HEAD:${GITHUB_REF_NAME} || (git pull --rebase -X theirs origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
